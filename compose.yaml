name: book-reader-outreach
x-common: &common
  build: .
  image: book-reader-outreach:1.3.1
  restart: unless-stopped
  init: true
  environment:
    OUTREACH_DATA_DIR: /data
    OUTREACH_SECURE_COOKIE: ${OUTREACH_SECURE_COOKIE:-false}
  volumes:
    - outreach-data:/data
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 512m
  cpus: 1.0
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  web:
    <<: *common
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8096}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *common
    command: ["python", "-m", "outreach.worker"]
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "python", "-m", "outreach.cli", "worker-health"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
volumes:
  outreach-data:
