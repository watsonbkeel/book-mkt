# Add a NEW dedicated virtual host; replace outreach.example.com with your real host.
# This is only HTTP bootstrap. Configure trusted HTTPS with your current certificate process.
# Once HTTPS is working, enforce HTTPS redirects and set OUTREACH_SECURE_COOKIE=true.
server {
    listen 80;
    server_name outreach.example.com;
    client_max_body_size 200k;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}
