<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · Reader Studio</title><link rel="stylesheet" href="/static/app.css"></head><body class="login-body"><section class="login-card"><span class="eyebrow">READER STUDIO</span><h1>让邀请有依据。<br>让阅读有回响。</h1><p>《Use AI to Direct AI》私有读者拓展工作台</p>{% if not configured %}<div class="warning">请先在服务器运行初始化命令创建管理员；没有默认密码。</div>{% else %}{% if error %}<div class="warning">{{error}}</div>{% endif %}<form method="post" action="/login"><input type="hidden" name="csrf" value="{{csrf}}"><label>管理员<input name="username" autocomplete="username" required></label><label>密码<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">进入工作台</button></form>{% endif %}<small>此页面仅供你与授权管理员使用。</small></section></body></html>
